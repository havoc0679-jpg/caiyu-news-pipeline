<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>采毓新聞 · 管理後台</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1a5fa8;--blue-d:#0f4285;--blue-l:#e8f0fb;
  --green:#16a34a;--green-l:#dcfce7;
  --red:#d93025;--red-l:#fff0f0;
  --yellow:#f59e0b;--yellow-l:#fef3c7;
  --text:#1a1a1a;--t2:#444;--muted:#888;
  --border:#ddd;--bg:#f5f5f5;--white:#fff;
  --serif:'Noto Serif TC',serif;--sans:'Noto Sans TC',sans-serif;
}
body{background:var(--bg);font-family:var(--sans);color:var(--text);min-height:100vh}
#root{min-height:100vh}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--white);border:1px solid var(--border);border-top:4px solid var(--blue);padding:36px;width:360px;max-width:100%}
.login-title{font-family:var(--serif);font-size:20px;font-weight:900;color:var(--blue);margin-bottom:4px}
.login-sub{font-size:11px;color:var(--muted);letter-spacing:1.5px;margin-bottom:24px}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#1a1a2e;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 16px;border-bottom:1px solid #333;font-family:var(--serif);font-size:15px;font-weight:900;color:white}
.brand small{display:block;font-size:9px;color:#5a8acc;margin-top:3px;font-weight:400;font-family:var(--sans);letter-spacing:2px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:13px;color:#aaa;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .15s;font-family:var(--sans)}
.nav-btn:hover,.nav-btn.on{background:#0f4285;color:white}
.nav-badge{margin-left:auto;background:var(--red);color:white;font-size:9px;padding:1px 6px;border-radius:8px}
.main{flex:1;padding:24px 28px;overflow-x:hidden;min-width:0}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-family:var(--serif);font-size:22px;font-weight:900;color:var(--text)}
.page-sub{font-size:12px;color:var(--muted);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat{background:white;border:1px solid var(--border);border-top:3px solid var(--blue);padding:14px 16px}
.stat-n{font-family:var(--serif);font-size:26px;font-weight:900;color:var(--blue)}
.stat-l{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:1px}
.stat.r{border-top-color:var(--red)}.stat.r .stat-n{color:var(--red)}
.stat.g{border-top-color:var(--green)}.stat.g .stat-n{color:var(--green)}
.stat.y{border-top-color:var(--yellow)}.stat.y .stat-n{color:var(--yellow)}
.cat-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:24px}
.cat-stat{background:white;border:1px solid var(--border);padding:10px 12px;text-align:center;cursor:pointer;transition:all .15s}
.cat-stat:hover{border-color:var(--blue);background:var(--blue-l)}
.cat-stat-n{font-family:var(--serif);font-size:18px;font-weight:900;color:var(--blue)}
.cat-stat-l{font-size:11px;color:var(--muted);margin-top:2px}
.btn{background:var(--blue);color:white;border:none;padding:8px 14px;font-size:13px;font-family:var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:5px;border-radius:3px;transition:all .15s;font-weight:500}
.btn:hover{background:var(--blue-d)}
.btn:disabled{background:#ccc;cursor:not-allowed}
.btn-big{font-size:15px;padding:12px 20px}
.btn-green{background:var(--green)}.btn-green:hover{background:#15803d}
.btn-red{background:var(--red)}.btn-red:hover{background:#b91c1c}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--t2);padding:7px 13px;font-size:12px;cursor:pointer;border-radius:3px;font-family:var(--sans);transition:all .15s}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.card{background:white;border:1px solid var(--border);margin-bottom:16px}
.card-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-title{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--blue)}
.card-body{padding:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-btn{background:none;border:1px solid var(--border);padding:5px 11px;font-size:12px;cursor:pointer;border-radius:3px;color:var(--muted);font-family:var(--sans);transition:all .15s}
.filter-btn:hover{border-color:var(--blue);color:var(--blue)}
.filter-btn.on{background:var(--blue);border-color:var(--blue);color:white}
.search-input{border:1px solid var(--border);padding:6px 12px;font-size:13px;font-family:var(--sans);outline:none;border-radius:3px;width:200px}
.search-input:focus{border-color:var(--blue)}
.tbl{width:100%;border-collapse:collapse;background:white}
.tbl th{background:#fafafa;padding:9px 14px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;text-align:left;border-bottom:2px solid var(--blue)}
.tbl td{padding:10px 14px;border-bottom:1px solid #f0f0f0;font-size:13px;vertical-align:middle}
.tbl tr:hover td{background:var(--blue-l)}
.tbl tr:last-child td{border-bottom:none}
.t-thumb{width:54px;height:38px;object-fit:cover;border-radius:2px;background:var(--blue-l);display:block}
.t-thumb-empty{width:54px;height:38px;background:linear-gradient(135deg,var(--blue) 0%,var(--blue-d) 100%);border-radius:2px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:18px}
.t-title{font-weight:600;max-width:340px;line-height:1.4}
.t-title .src{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.t-cat{font-size:11px;color:var(--blue);font-weight:700;letter-spacing:.5px;white-space:nowrap}
.t-date{font-size:11px;color:var(--muted);white-space:nowrap}
.t-flag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:2px;letter-spacing:1px;font-weight:700;margin-right:3px}
.flag-feat{background:var(--yellow);color:white}
.flag-ai{background:var(--red);color:white}
.flag-draft{background:#999;color:white}
.flag-pub{background:var(--green);color:white}
.t-actions{display:flex;gap:5px;flex-wrap:nowrap}
.icon-btn{background:none;border:1px solid var(--border);width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:all .15s;border-radius:3px;font-size:13px}
.icon-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.icon-btn.danger:hover{border-color:var(--red);color:var(--red);background:var(--red-l)}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.fi,.fs,.ft{border:1px solid var(--border);padding:9px 12px;font-size:13px;font-family:var(--sans);color:var(--text);outline:none;transition:border-color .15s;width:100%;background:white;border-radius:3px}
.fi:focus,.fs:focus,.ft:focus{border-color:var(--blue)}
.ft{resize:vertical;min-height:120px;line-height:1.7;font-family:var(--sans)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fc2{grid-column:span 2}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);cursor:pointer;padding:6px 0}
.form-foot{display:flex;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);justify-content:flex-end}
.alert{padding:10px 14px;font-size:13px;margin-bottom:14px;border-radius:3px;line-height:1.5}
.alert-err{background:var(--red-l);border:1px solid #fcc;color:var(--red)}
.alert-ok{background:var(--green-l);border:1px solid #abe5b8;color:#155724}
.alert-warn{background:var(--yellow-l);border:1px solid #fde68a;color:#92400e}
.alert-info{background:var(--blue-l);border:1px solid #b8d4f0;color:var(--blue-d)}
.run-list{display:flex;flex-direction:column;gap:6px}
.run-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fafafa;border:1px solid var(--border);border-radius:3px;font-size:12px}
.run-icon{font-size:14px;flex-shrink:0;width:18px;text-align:center}
.run-info{flex:1;min-width:0}
.run-time{color:var(--muted);font-size:11px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.kbd{background:#eee;border:1px solid #ccc;padding:1px 5px;font-size:11px;font-family:monospace;border-radius:2px}
.help{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.7}
.help a{color:var(--blue)}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--serif);font-size:16px;color:var(--text);margin-bottom:6px}
.image-preview{margin-top:8px;padding:8px;background:#fafafa;border:1px solid var(--border);border-radius:3px;display:flex;align-items:center;gap:10px}
.image-preview img{width:120px;height:90px;object-fit:cover;border-radius:2px}
.image-preview-info{flex:1;font-size:11px;color:var(--muted);line-height:1.6;word-break:break-all}
.image-fail{color:var(--red);font-size:11px;padding:6px 10px;background:var(--red-l);border-radius:2px}
.detail-pre{padding:18px;background:#fafafa;border:1px solid var(--border);max-height:400px;overflow:auto;border-radius:3px}
.detail-pre h4{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px}
.detail-pre .meta{font-size:11px;color:var(--muted);margin-bottom:10px}
.detail-pre .body{font-size:13px;color:var(--t2);line-height:1.9;white-space:pre-line}
@media(max-width:900px){
  .layout{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:8px}
  .brand{flex:1 0 100%}
  .nav-btn{width:auto;flex:1 1 auto}
  .stats{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr}.fc2{grid-column:span 1}
  .main{padding:16px}
  .tbl{display:block;overflow-x:auto}
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ═══════════════════════════════════════════════════════════
// ⚙️ 設定區
// ═══════════════════════════════════════════════════════════

const ADMIN_PASSWORD = "caiyu2025";
const GITHUB_OWNER = "你的GitHub帳號";
const GITHUB_REPO = "caiyu-news-pipeline";
const WORKFLOW_FILE = "auto-update.yml";

const SUPABASE_URL = "https://htlxogcyzilghxkqlbej.supabase.co";
const SUPABASE_SERVICE_KEY = "你的_service_role_key_貼這裡";

// ═══════════════════════════════════════════════════════════

const CATS = ["籃球","排球","棒球","足球","桌球","羽球","網球","匹克球","游泳","活動產業","科技展演","其他"];
const PAT_KEY = "caiyu_admin_pat";
const SESSION_KEY = "caiyu_admin_session";

const CAT_ICON = {"籃球":"🏀","排球":"🏐","棒球":"⚾","足球":"⚽","桌球":"🏓","羽球":"🏸","網球":"🎾","匹克球":"🥒","游泳":"🏊","活動產業":"🎪","科技展演":"🚀","其他":"📰"};

const EMPTY_FORM = {
  title: "", category: "籃球", summary: "", content: "",
  author: "采毓編輯部", tags: "", featured: false, image: "",
  is_published: true, source_url: "", source_name: ""
};

async function supaFetch(path, opts = {}) {
  const url = `${SUPABASE_URL}/rest/v1${path}`;
  const headers = {
    "apikey": SUPABASE_SERVICE_KEY,
    "Authorization": `Bearer ${SUPABASE_SERVICE_KEY}`,
    "Content-Type": "application/json",
    "Prefer": opts.method === "POST" ? "return=representation" : "return=minimal",
    ...(opts.headers || {})
  };
  const res = await fetch(url, { ...opts, headers });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`HTTP ${res.status}: ${txt}`);
  }
  if (res.status === 204 || res.headers.get("content-length") === "0") return null;
  return await res.json();
}

async function listArticles() {
  return await supaFetch("/articles?select=*&order=published_at.desc&limit=300");
}
async function createArticle(data) {
  return await supaFetch("/articles", { method: "POST", body: JSON.stringify(data) });
}
async function updateArticle(id, data) {
  return await supaFetch(`/articles?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(data) });
}
async function deleteArticle(id) {
  return await supaFetch(`/articles?id=eq.${id}`, { method: "DELETE" });
}

function App() {
  const [authed, setAuthed] = useState(sessionStorage.getItem(SESSION_KEY) === "ok");
  if (!authed) return <Login onLogin={() => setAuthed(true)} />;
  return <Panel onLogout={() => { sessionStorage.removeItem(SESSION_KEY); setAuthed(false); }} />;
}

function Login({ onLogin }) {
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  function submit(e) {
    e.preventDefault();
    if (pw === ADMIN_PASSWORD) {
      sessionStorage.setItem(SESSION_KEY, "ok");
      onLogin();
    } else setErr("密碼錯誤，請重試");
  }
  return (
    <div className="login-page">
      <div className="login-box">
        <div className="login-title">🔒 采毓 管理後台</div>
        <div className="login-sub">NEWS CMS · ADMIN LOGIN</div>
        {err && <div className="alert alert-err">{err}</div>}
        <form onSubmit={submit}>
          <div className="fg">
            <label className="fl">管理員密碼</label>
            <input className="fi" type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="請輸入密碼" autoFocus />
          </div>
          <button className="btn btn-big" type="submit" style={{width:"100%",justifyContent:"center"}}>進入後台</button>
        </form>
      </div>
    </div>
  );
}

function Panel({ onLogout }) {
  const [tab, setTab] = useState("dashboard");
  const [arts, setArts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState(EMPTY_FORM);
  const [filterCat, setFilterCat] = useState("全部");
  const [filterStatus, setFilterStatus] = useState("全部");
  const [search, setSearch] = useState("");

  async function refresh() {
    setLoading(true); setErr("");
    try {
      const data = await listArticles();
      setArts(data || []);
    } catch (e) { setErr(e.message); }
    finally { setLoading(false); }
  }

  useEffect(() => { refresh(); }, []);

  const filtered = useMemo(() => {
    return arts.filter(a => {
      const mc = filterCat === "全部" || a.category === filterCat;
      const ms = !search || a.title?.includes(search) || a.summary?.includes(search);
      let mst = true;
      if (filterStatus === "已發布") mst = a.is_published;
      else if (filterStatus === "未發布") mst = !a.is_published;
      else if (filterStatus === "精選") mst = a.featured;
      else if (filterStatus === "AI生成") mst = a.is_ai_generated;
      else if (filterStatus === "人工") mst = !a.is_ai_generated;
      return mc && ms && mst;
    });
  }, [arts, filterCat, filterStatus, search]);

  const stats = useMemo(() => ({
    total: arts.length,
    published: arts.filter(a => a.is_published).length,
    featured: arts.filter(a => a.featured).length,
    ai: arts.filter(a => a.is_ai_generated).length,
  }), [arts]);

  const catStats = useMemo(() => {
    return CATS.map(c => ({ c, n: arts.filter(a => a.category === c).length }));
  }, [arts]);

  function openNew() { setForm(EMPTY_FORM); setEditId(null); setTab("form"); }
  function openEdit(a) {
    setForm({...a, tags: Array.isArray(a.tags) ? a.tags.join(", ") : (a.tags || "")});
    setEditId(a.id); setTab("form");
  }
  async function saveForm(e) {
    e.preventDefault();
    const payload = {
      title: form.title, category: form.category,
      summary: form.summary, content: form.content,
      author: form.author,
      tags: form.tags ? form.tags.split(",").map(t=>t.trim()).filter(Boolean) : [],
      featured: form.featured, image: form.image || null,
      is_published: form.is_published,
      source_url: form.source_url || null, source_name: form.source_name || null,
    };
    try {
      if (editId) await updateArticle(editId, payload);
      else {
        payload.author = payload.author || "采毓編輯部";
        payload.is_ai_generated = false;
        payload.published_at = new Date().toISOString();
        await createArticle(payload);
      }
      await refresh();
      setTab("list");
    } catch (e) { alert("儲存失敗：" + e.message); }
  }
  async function toggleField(a, field) {
    try { await updateArticle(a.id, { [field]: !a[field] }); await refresh(); }
    catch (e) { alert("更新失敗：" + e.message); }
  }
  async function delArt(a) {
    if (!confirm(`確定刪除「${a.title}」？`)) return;
    try { await deleteArticle(a.id); await refresh(); }
    catch (e) { alert("刪除失敗：" + e.message); }
  }

  return (
    <div className="layout">
      <aside className="sidebar">
        <div className="brand">采毓新聞後台<small>NEWS CMS SYSTEM</small></div>
        <button className={`nav-btn ${tab==="dashboard"?"on":""}`} onClick={()=>setTab("dashboard")}>📊 總覽</button>
        <button className={`nav-btn ${tab==="list"?"on":""}`} onClick={()=>{setFilterCat("全部");setFilterStatus("全部");setSearch("");setTab("list");}}>
          📋 文章列表 <span className="nav-badge">{stats.total}</span>
        </button>
        <button className={`nav-btn ${tab==="form"?"on":""}`} onClick={openNew}>✏️ 新增文章</button>
        <button className={`nav-btn ${tab==="trigger"?"on":""}`} onClick={()=>setTab("trigger")}>🔄 立即抓取</button>
        <div style={{flex:1}} />
        <button className="nav-btn" onClick={()=>window.open("index.html","_blank")}>🏠 開啟前台</button>
        <button className="nav-btn" onClick={onLogout}>🔓 登出</button>
      </aside>

      <main className="main">
        {err && <div className="alert alert-err">⚠️ {err}</div>}

        {tab === "dashboard" && <Dashboard stats={stats} catStats={catStats} arts={arts} setTab={setTab} setFilterCat={setFilterCat} />}
        {tab === "list" && (
          <ArticleList
            arts={filtered} allCats={CATS}
            filterCat={filterCat} setFilterCat={setFilterCat}
            filterStatus={filterStatus} setFilterStatus={setFilterStatus}
            search={search} setSearch={setSearch}
            onNew={openNew} onEdit={openEdit}
            onToggleField={toggleField} onDelete={delArt}
            loading={loading} onRefresh={refresh}
          />
        )}
        {tab === "form" && <ArticleForm form={form} setForm={setForm} editId={editId} onSave={saveForm} onCancel={()=>setTab("list")} />}
        {tab === "trigger" && <TriggerPanel />}
      </main>
    </div>
  );
}

function Dashboard({ stats, catStats, arts, setTab, setFilterCat }) {
  const recent = arts.slice(0, 5);
  function gotoCat(c) { setFilterCat(c); setTab("list"); }
  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">總覽</div>
          <div className="page-sub">采毓新聞 CMS 概況</div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn" onClick={()=>setTab("trigger")}>🔄 立即抓取新聞</button>
          <button className="btn btn-green" onClick={()=>setTab("form")}>✏️ 新增文章</button>
        </div>
      </div>

      <div className="stats">
        <div className="stat"><div className="stat-n">{stats.total}</div><div className="stat-l">總文章數</div></div>
        <div className="stat g"><div className="stat-n">{stats.published}</div><div className="stat-l">已發布</div></div>
        <div className="stat y"><div className="stat-n">{stats.featured}</div><div className="stat-l">精選文章</div></div>
        <div className="stat r"><div className="stat-n">{stats.ai}</div><div className="stat-l">AI 自動生成</div></div>
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">📊 各分類文章數</div></div>
        <div className="card-body" style={{paddingTop:12}}>
          <div className="cat-stats">

              <div key={c} className="cat-stat" onClick={()=>gotoCat(c)}>

          <div className="card-title">📰 最近 5 篇</div>

}

                  <td className="t-cat">{a.category}</td>
                  <td>

          <div className="page-sub">{editId ? `ID: ${editId}` : "從零開始建立一篇文章"}</div>
        </div>
      </div>

      <form className="card" onSubmit={onSave}>
        <div className="card-body">
          <div className="fgrid">
            <div className="fg fc2">
              <label className="fl">標題 *</label>
              <input className="fi" required value={form.title} onChange={e=>fc("title",e.target.value)} placeholder="文章標題" />
            </div>
            <div className="fg">
              <label className="fl">分類 *</label>
              <select className="fs" value={form.category} onChange={e=>fc("category",e.target.value)}>
                {CATS.map(c => <option key={c} value={c}>{CAT_ICON[c]} {c}</option>)}
              </select>
            </div>
            <div className="fg">
              <label className="fl">作者</label>
              <input className="fi" value={form.author} onChange={e=>fc("author",e.target.value)} />
            </div>
            <div className="fg fc2">
              <label className="fl">📷 封面圖片網址</label>
              <input className="fi" value={form.image||""} onChange={e=>{fc("image",e.target.value);setImgErr(false);}} placeholder="https://..." />
              {form.image && (
                <div className="image-preview">
                  {imgErr ? (
                    <div className="image-fail">❌ 圖片無法載入。請確認網址是否正確、可公開存取</div>

                    <>

                        <div>📐 圖片預覽（前台會以 16:9 比例顯示）</div>
                        <div style={{marginTop:4,fontSize:10}}>{form.image}</div>
                      </div>

              <div className="help">

                <a href="https://www.pexels.com" target="_blank">Pexels</a>（免費商用）。

            <div className="fg fc2">

            </div>
            <div className="fg fc2">
              <label className="fl">內文 *</label>
              <textarea className="ft" required style={{minHeight:240}} value={form.content||""} onChange={e=>fc("content",e.target.value)} placeholder="文章正文…" />
            </div>
            <div className="fg">
              <label className="fl">標籤（逗號分隔）</label>

              <input className="fi" value={form.source_name||""} onChange={e=>fc("source_name",e.target.value)} placeholder="例：聯合新聞網" />

  );
}

function TriggerPanel() {
  const [pat, setPat] = useState(localStorage.getItem(PAT_KEY) || "");
  const [savedPat, setSavedPat] = useState(!!localStorage.getItem(PAT_KEY));
  const [running, setRunning] = useState(false);
  const [msg, setMsg] = useState(null);
  const [runs, setRuns] = useState([]);
  const [loadingRuns, setLoadingRuns] = useState(false);

  async function loadRuns() {
    if (!savedPat || GITHUB_OWNER === "你的GitHub帳號") return;
    setLoadingRuns(true);
    try {
      const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=8`, {
        headers: { "Accept":"application/vnd.github+json", "Authorization":`Bearer ${pat||localStorage.getItem(PAT_KEY)}` }
      });
      if (res.ok) {
        const data = await res.json();
        setRuns(data.workflow_runs || []);
      }
    } catch {}
    setLoadingRuns(false);
  }

  useEffect(() => { loadRuns(); }, [savedPat]);

  async function trigger() {
    if (GITHUB_OWNER === "你的GitHub帳號") {
      setMsg({ type: "err", text: "請先在 admin.html 開頭把 GITHUB_OWNER 改成你的 GitHub 帳號" });
      return;
    }
    if (!pat) { setMsg({ type: "err", text: "請先輸入 GitHub PAT" }); return; }

    setRunning(true); setMsg(null);
    try {
      const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`, {
        method: "POST",
        headers: { "Accept": "application/vnd.github+json", "Authorization": `Bearer ${pat}`, "X-GitHub-Api-Version": "2022-11-28" },
        body: JSON.stringify({ ref: "main" }),
      });
      if (res.status === 204) {
        if (!savedPat) { localStorage.setItem(PAT_KEY, pat); setSavedPat(true); }
        setMsg({ type: "ok", text: "✅ 已成功觸發！pipeline 大約 3-8 分鐘後完成（11 個分類要跑）。" });
        setTimeout(loadRuns, 2500);
      } else {
        const txt = await res.text();
        let detail = txt;
        try { detail = JSON.parse(txt).message || txt; } catch {}
        setMsg({ type: "err", text: `❌ 觸發失敗 (${res.status}): ${detail}` });
      }
    } catch (e) {
      setMsg({ type: "err", text: `❌ 網路錯誤：${e.message}` });
    } finally {
      setRunning(false);
    }
  }

  function clearPat() {
    if (!confirm("確定要清除已存的 Token？")) return;
    localStorage.removeItem(PAT_KEY);
    setPat(""); setSavedPat(false); setRuns([]);
  }

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">⚡ 立即抓取新聞</div>
          <div className="page-sub">手動觸發 GitHub Actions 立刻執行 pipeline · 每類 2 篇 / 上限 12 篇</div>
        </div>
        <button className="btn-ghost" onClick={loadRuns}>🔄 重新整理</button>
      </div>

      <div className="card">
        <div className="card-body">
          {msg && <div className={`alert alert-${msg.type==="ok"?"ok":"err"}`}>{msg.text}</div>}

          {!savedPat && (
            <>
              <div className="alert alert-warn">⚠️ <strong>第一次使用</strong>：請先設定 GitHub Personal Access Token</div>
              <div className="fg">
                <label className="fl">GitHub Personal Access Token</label>
                <input className="fi" type="password" value={pat} onChange={e=>setPat(e.target.value)} placeholder="github_pat_xxxxxxxxxxxxxxxxxxxxxxx" />
                <div className="help">
                  還沒有 PAT？點 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">這裡建立</a>，
                  Repository 選 <span className="kbd">{GITHUB_REPO}</span>，
                  Permissions 把 <strong>Actions</strong> 改成 <span className="kbd">Read and write</span>。
                </div>
              </div>
            </>
          )}

          <button className="btn btn-big" onClick={trigger} disabled={running} style={{width:"100%",justifyContent:"center"}}>
            {running ? <><span className="spinner"></span> 觸發中…</> : "🔄 立即抓取新聞"}
          </button>

          {savedPat && (
            <div style={{display:"flex",gap:8,marginTop:10,justifyContent:"flex-end"}}>
              <button className="btn-ghost" onClick={clearPat}>清除已存的 Token</button>
            </div>
          )}
        </div>
      </div>

      <div className="card">
        <div className="card-head">
          <div className="card-title">📊 最近執行紀錄</div>
          {loadingRuns && <span style={{fontSize:11,color:"var(--muted)"}}>載入中…</span>}
        </div>
        <div className="card-body">
          {runs.length === 0 ? (
            <div className="help">尚無執行紀錄（或 PAT 未設定）</div>
          ) : (
            <div className="run-list">
              {runs.map(r => {
                let icon = "⏳";
                if (r.status === "completed") icon = r.conclusion === "success" ? "✅" : "❌";
                else if (r.status === "in_progress") icon = "🟡";
                else if (r.status === "queued") icon = "⌛";
                const time = new Date(r.created_at).toLocaleString("zh-TW", { hour12: false });
                const trigger = r.event === "workflow_dispatch" ? "手動觸發" : r.event === "schedule" ? "排程觸發" : r.event;
                return (
                  <div className="run-item" key={r.id}>
                    <div className="run-icon">{icon}</div>
                    <div className="run-info">
                      <div><strong>{trigger}</strong> · {r.status === "completed" ? r.conclusion : r.status}</div>
                      <div className="run-time">{time}</div>
                    </div>
                    <a href={r.html_url} target="_blank" rel="noopener noreferrer" className="btn-ghost" style={{fontSize:11,padding:"4px 8px",textDecoration:"none"}}>看詳情</a>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
